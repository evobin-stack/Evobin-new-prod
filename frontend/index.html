<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoBin - AI E-Waste Management & Recycling</title>
  </head>
  <body>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function clearGoogTransCookies() {
        var domains = [
          window.location.hostname,
          '.' + window.location.hostname,
          window.location.hostname.replace(/^www\./, ''),
          '.' + window.location.hostname.replace(/^www\./, ''),
          ''
        ];
        var paths = ['/', ''];
        domains.forEach(function(d) {
          paths.forEach(function(p) {
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC;' + (p ? ' path=' + p + ';' : '') + (d ? ' domain=' + d + ';' : '');
            document.cookie = 'googtrans=/en/en; expires=Thu, 01 Jan 1970 00:00:00 UTC;' + (p ? ' path=' + p + ';' : '') + (d ? ' domain=' + d + ';' : '');
          });
        });
      }

      function googleTranslateElementInit() {
        var pref = localStorage.getItem('preferredLanguage');
        if (pref === 'en' || !pref) {
          clearGoogTransCookies();
          return;
        }
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,te',
            autoDisplay: false,
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
